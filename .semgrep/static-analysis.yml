rules:
  - id: python.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: Avoid subprocess shell=True; use argv lists to prevent command injection.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python.eval-or-exec
    languages: [python]
    severity: ERROR
    message: Avoid eval/exec in CI automation scripts.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: python.tempfile-mktemp
    languages: [python]
    severity: ERROR
    message: tempfile.mktemp is insecure; use mkstemp/NamedTemporaryFile.
    pattern: tempfile.mktemp(...)
