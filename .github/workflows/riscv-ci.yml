name: RISC-V CI

on:
  push:
  pull_request:

concurrency:
  group: riscv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  riscv-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils-riscv64-unknown-elf \
            gcc-riscv64-unknown-elf \
            qemu-system-misc

      - name: Build kernel + fs image
        run: |
          make kernel/kernel fs.img

      - name: Quick user tests
        run: |
          python3 ./test-xv6.py -q usertests

      - name: Crash recovery tests
        run: |
          python3 ./test-xv6.py crash
