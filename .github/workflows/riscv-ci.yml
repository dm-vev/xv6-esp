name: RISC-V CI

on:
  push:
  pull_request:

concurrency:
  group: riscv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  riscv-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils-riscv64-unknown-elf \
            gcc-riscv64-unknown-elf \
            qemu-system-misc

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: ${{ runner.os }}-espidf-v6.0-riscv-ci-v1

      - name: Prepare ESP-IDF
        run: |
          if [ ! -d "$HOME/esp-idf/.git" ]; then
            git clone --depth 1 --branch release/v6.0 https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          fi
          cd "$HOME/esp-idf"
          ./install.sh esp32s3
          python3 "$HOME/esp-idf/tools/idf_tools.py" install qemu-xtensa

      - name: Build kernel + fs image
        run: |
          make kernel/kernel fs.img

      - name: Quick user tests
        run: |
          source "$HOME/esp-idf/export.sh"
          rm -rf build
          python3 ./test-xv6.py -q usertests

      - name: Crash recovery tests
        run: |
          source "$HOME/esp-idf/export.sh"
          rm -rf build
          python3 ./test-xv6.py crash
