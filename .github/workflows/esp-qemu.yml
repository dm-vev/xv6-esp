name: ESP32 QEMU

on:
  push:
  pull_request:

concurrency:
  group: esp-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: ${{ runner.os }}-espidf-v6.0-cache-v1

      - name: Prepare ESP-IDF
        run: |
          if [ ! -d "$HOME/esp-idf/.git" ]; then
            git clone --depth 1 --branch release/v6.0 https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          fi
          cd "$HOME/esp-idf"
          ./install.sh esp32s3

      - name: Build
        run: |
          source "$HOME/esp-idf/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: QEMU Smoke
        run: |
          source "$HOME/esp-idf/export.sh"
          python3 ./scripts/qemu_smoke_esp.py

      - name: QEMU Stress
        run: |
          source "$HOME/esp-idf/export.sh"
          python3 ./scripts/qemu_stress_esp.py

      - name: QEMU Soak
        run: |
          source "$HOME/esp-idf/export.sh"
          python3 ./scripts/qemu_soak_esp.py

      - name: QEMU Applets
        run: |
          source "$HOME/esp-idf/export.sh"
          python3 ./scripts/qemu_applets_esp.py

      - name: QEMU Regressions
        run: |
          source "$HOME/esp-idf/export.sh"
          python3 ./scripts/qemu_regressions_esp.py
