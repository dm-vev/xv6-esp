name: Static Analysis

on:
  push:
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: ${{ runner.os }}-espidf-v6.0-static-v1

      - name: Prepare ESP-IDF
        run: |
          if [ ! -d "$HOME/esp-idf/.git" ]; then
            git clone --depth 1 --branch release/v6.0 https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          fi
          cd "$HOME/esp-idf"
          ./install.sh esp32s3

      - name: Install Static Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy codespell
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep ruff bandit

      - name: Build (compile_commands.json)
        run: |
          source "$HOME/esp-idf/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Run Static Analysis
        run: |
          source "$HOME/esp-idf/export.sh"
          STRICT=1 BUILD_DIR=build ./scripts/static_analysis.sh

