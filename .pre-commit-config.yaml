repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: static-analysis
        name: static-analysis
        entry: ./scripts/static_analysis.sh
        language: system
        pass_filenames: false

